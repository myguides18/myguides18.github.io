<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - GameGuide游戏攻略站</title>
    <style>
        :root {
            --bg: #0f0f1a;
            --card-bg: #1a1a2e;
            --border: #2a2a4a;
            --accent: #6c5ce7;
            --accent-hover: #7d6ff0;
            --text: #e0e0e0;
            --text-secondary: #a0a0b0;
            --gold: #f0a500;
            --tag-bg: #252540;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
        }
        .header {
            background: rgba(15, 15, 26, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; padding: 0 24px;
        }
        .header-inner {
            max-width: 1200px; margin: 0 auto; display: flex; align-items: center;
            justify-content: space-between; height: 64px;
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); text-decoration: none; letter-spacing: -0.5px; }
        .logo span { color: var(--gold); }
        .nav-links { display: flex; gap: 32px; list-style: none; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }
        .search-box { display: flex; align-items: center; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .search-box input { background: transparent; border: none; color: var(--text); padding: 8px 16px; font-size: 14px; width: 180px; outline: none; }
        .search-box input::placeholder { color: var(--text-secondary); }
        .search-box button { background: var(--accent); border: none; color: white; padding: 8px 16px; cursor: pointer; font-size: 14px; }
        .search-box button:hover { background: var(--accent-hover); }
        .theme-toggle {
            background: none; border: 1px solid var(--border); color: var(--text); font-size: 18px;
            cursor: pointer; padding: 6px 10px; border-radius: 8px; margin-left: 8px; transition: border-color 0.2s;
        }
        .theme-toggle:hover { border-color: var(--accent); }
        .main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
        .search-header { margin-bottom: 32px; }
        .search-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .search-header .query-highlight { color: var(--accent); }
        .search-header .result-count { color: var(--text-secondary); font-size: 14px; }
        .result-item {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 24px; margin-bottom: 16px; transition: border-color 0.2s;
        }
        .result-item:hover { border-color: var(--accent); }
        .result-item h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .result-item h3 a { color: var(--accent); text-decoration: none; }
        .result-item h3 a:hover { text-decoration: underline; }
        .result-item .result-game { font-size: 12px; color: var(--gold); font-weight: 600; margin-bottom: 8px; }
        .result-item .result-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
        .no-result {
            text-align: center; padding: 60px 20px; color: var(--text-secondary);
        }
        .no-result h2 { font-size: 24px; margin-bottom: 12px; color: var(--text); }
        .no-result p { font-size: 14px; margin-bottom: 20px; }
        .no-result .suggestions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .no-result .suggestion-tag {
            background: var(--tag-bg); border: 1px solid var(--border); color: var(--text-secondary);
            padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .no-result .suggestion-tag:hover { background: var(--accent); border-color: var(--accent); color: white; }
        .footer {
            text-align: center; padding: 32px; border-top: 1px solid var(--border);
            color: var(--text-secondary); font-size: 13px; margin-top: 40px;
        }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .search-box input { width: 100px; }
            .search-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
<header class="header">
    <div class="header-inner">
        <a href="index.html" class="logo">Game<span>Guide</span></a>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="index.html">PC游戏</a></li>
            <li><a href="index.html">手游攻略</a></li>
            <li><a href="index.html">主机游戏</a></li>
            <li><a href="index.html">新游评测</a></li>
        </ul>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索游戏攻略...">
            <button onclick="doSearch()">搜索</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="切换夜间/日间模式">🌙</button>
    </div>
</header>

<main class="main">
    <div class="search-header">
        <h1>搜索结果：<span class="query-highlight" id="queryDisplay"></span></h1>
        <div class="result-count" id="resultCount"></div>
    </div>
    <div id="searchResults"></div>
</main>

<footer class="footer">
    <p>GameGuide 游戏攻略站 &copy; 2026 — 为玩家提供最专业的游戏攻略服务</p>
</footer>

<script>
(function() {
    var saved = localStorage.getItem('theme');
    if (saved === 'light') {
        document.documentElement.style.setProperty('--bg', '#f5f5f5');
        document.documentElement.style.setProperty('--card-bg', '#ffffff');
        document.documentElement.style.setProperty('--border', '#e0e0e0');
        document.documentElement.style.setProperty('--text', '#1a1a1a');
        document.documentElement.style.setProperty('--text-secondary', '#666666');
        document.documentElement.style.setProperty('--tag-bg', '#f0f0f0');
        document.querySelector('.theme-toggle').textContent = '☀️';
    }
})();

function toggleTheme() {
    var root = document.documentElement;
    var btn = document.querySelector('.theme-toggle');
    if (btn.textContent === '🌙') {
        root.style.setProperty('--bg', '#f5f5f5');
        root.style.setProperty('--card-bg', '#ffffff');
        root.style.setProperty('--border', '#e0e0e0');
        root.style.setProperty('--text', '#1a1a1a');
        root.style.setProperty('--text-secondary', '#666666');
        root.style.setProperty('--tag-bg', '#f0f0f0');
        btn.textContent = '☀️';
        localStorage.setItem('theme', 'light');
    } else {
        root.style.setProperty('--bg', '#0f0f1a');
        root.style.setProperty('--card-bg', '#1a1a2e');
        root.style.setProperty('--border', '#2a2a4a');
        root.style.setProperty('--text', '#e0e0e0');
        root.style.setProperty('--text-secondary', '#a0a0b0');
        root.style.setProperty('--tag-bg', '#252540');
        btn.textContent = '🌙';
        localStorage.setItem('theme', 'dark');
    }
}

function doSearch() {
    var q = document.getElementById('searchInput').value.trim();
    if (q) { window.location.href = 'search.html?q=' + encodeURIComponent(q); }
}

// Search data
var pages = [
    { title: "艾尔登法环攻略专题", game: "艾尔登法环", url: "eldenring.html", desc: "全BOSS打法详解：从恶兆到艾尔登之兽，详细解析每一个主线BOSS的攻击模式、弱点与最佳应对策略。", keywords: "艾尔登法环 法环 elden ring 魂系" },
    { title: "黑神话：悟空攻略专题", game: "黑神话：悟空", url: "blackmyth.html", desc: "隐藏结局触发条件与全收集路线图，包含全部隐藏BOSS、支线任务、法宝收集的完整攻略。", keywords: "黑神话 悟空 黑神话悟空 西游记" },
    { title: "原神攻略专题", game: "原神", url: "genshin.html", desc: "5.6版本深渊12层满星阵容推荐，针对本期深渊环境分析最优配队，平民阵容也能轻松满星。", keywords: "原神 genshin 深渊 元素反应" },
    { title: "幻兽帕鲁攻略专题", game: "幻兽帕鲁", url: "palworld.html", desc: "新手开荒指南：前期最强帕鲁捕捉路线，从零开始的开荒攻略，基地建设最优布局方案。", keywords: "幻兽帕鲁 palworld 帕鲁 配种" },
    { title: "塞尔达传说：王国之泪攻略专题", game: "塞尔达传说：王国之泪", url: "zelda-totk.html", desc: "全神庙位置与解谜攻略合集，152座神庙完整位置标注与解谜思路，含天空、地面、地底三层地图全覆盖。", keywords: "塞尔达 王国之泪 神庙 zelda" },
    { title: "CS2攻略专题", game: "CS2", url: "cs2.html", desc: "从菜鸟到大神：枪法训练与地图道具进阶，系统性的枪法提升方案，全地图烟雾弹、闪光弹投掷点位教学。", keywords: "CS2 反恐精英 Counter-Strike 枪法" },
    { title: "英雄联盟攻略专题", game: "英雄联盟", url: "lol.html", desc: "S16赛季各位置T0英雄推荐，上单、打野、中单、ADC、辅助各位置最强英雄分析与出装推荐。", keywords: "英雄联盟 LOL 上分 段位" },
    { title: "星露谷物语攻略专题", game: "星露谷物语", url: "stardew.html", desc: "第一年四季完整攻略，从春季开荒到冬季升级，种田、采矿、钓鱼、交友全指南。", keywords: "星露谷物语 星露谷 农场 种田 stardew" },
    { title: "博德之门3攻略专题", game: "博德之门3", url: "bg3.html", desc: "荣誉模式通关指南，职业搭配、队伍Build、关键剧情选择与战斗技巧全解析。", keywords: "博德之门3 baldurs gate DND D&D" },
    { title: "APEX英雄攻略专题", game: "APEX英雄", url: "apex.html", desc: "新赛季传奇推荐，各传奇技能解析、武器选择搭配、跳伞策略与缩圈战术。", keywords: "APEX 英雄 大逃杀 传奇 apex" },
    { title: "暗黑破坏神4攻略专题", game: "暗黑破坏神4", url: "diablo4.html", desc: "赛季开荒速通指南，升级路线、各职业强力Build、装备系统与威能详解。", keywords: "暗黑破坏神4 diablo 赛季 开荒" },
    { title: "速通攻略专题", game: "速通攻略", url: "speedrun.html", desc: "热门游戏速通路线合集，艾尔登法环、黑神话悟空、王国之泪等游戏最优化通关路线。", keywords: "速通 speedrun 竞速 世界纪录" },
    { title: "隐藏彩蛋专题", game: "隐藏彩蛋", url: "eastereggs.html", desc: "各大游戏隐藏彩蛋全收录，开发者的秘密内容、隐藏结局触发方法、特殊道具获取途径。", keywords: "彩蛋 隐藏 秘密 easter eggs" }
];

function getQueryParam(name) {
    var url = new URL(window.location.href);
    return url.searchParams.get(name) || '';
}

var query = getQueryParam('q');
document.getElementById('queryDisplay').textContent = query;
document.getElementById('searchInput').value = query;

if (!query) {
    document.getElementById('searchResults').innerHTML = '<div class="no-result"><h2>请输入搜索关键词</h2><p>在搜索框中输入游戏名称查找相关攻略</p></div>';
} else {
    var q = query.toLowerCase();
    var results = pages.filter(function(p) {
        return p.title.toLowerCase().indexOf(q) !== -1 ||
               p.game.toLowerCase().indexOf(q) !== -1 ||
               p.keywords.toLowerCase().indexOf(q) !== -1 ||
               p.desc.toLowerCase().indexOf(q) !== -1;
    });

    document.getElementById('resultCount').textContent = '共找到 ' + results.length + ' 个结果';

    if (results.length === 0) {
        var suggestionTags = ['艾尔登法环', '黑神话', '原神', 'CS2', 'LOL', '博德之门3', '速通', '彩蛋'];
        var tagsHtml = suggestionTags.map(function(t) {
            return '<span class="suggestion-tag" onclick="window.location.href=\\'search.html?q=' + encodeURIComponent(t) + '\\'">' + t + '</span>';
        }).join('');
        document.getElementById('searchResults').innerHTML =
            '<div class="no-result"><h2>未找到相关攻略</h2><p>建议尝试其他关键词，或浏览以下热门专题：</p><div class="suggestions">' + tagsHtml + '</div></div>';
    } else {
        var html = '';
        results.forEach(function(r) {
            html += '<div class="result-item">' +
                '<div class="result-game">' + r.game + '</div>' +
                '<h3><a href="' + r.url + '">' + r.title + '</a></h3>' +
                '<p class="result-desc">' + r.desc + '</p>' +
                '</div>';
        });
        document.getElementById('searchResults').innerHTML = html;
    }
}
</script>
</body>
</html>
